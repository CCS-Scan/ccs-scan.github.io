<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCS Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141b2d">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e7ee;--side:#141b2d;--side2:#1e2740;--sideink:#cfd6e6;
--dash:#1f6feb;--inv:#0f8a63;--in:#1e7a3c;--out:#c0392b;--wo:#8e44ad;--cnt:#b7791f;--log:#4c51bf;--rep:#475569;--items:#0e7490;--users:#8b5e34;--set:#4b5563;--accent:#1f6feb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* start screens */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(20,27,45,.12);padding:28px 32px;width:min(520px,100%)}
.box h1{margin:0 0 4px;font-size:22px}.box .sub{color:var(--muted);margin:0 0 18px}
.logo{font-weight:800;letter-spacing:.5px;font-size:28px;color:var(--dash);margin-bottom:6px}
.logo span{color:var(--ink)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid #cdd3de;border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,111,235,.35);border-color:var(--accent)}
.btn{border:0;border-radius:9px;padding:9px 16px;background:var(--accent);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:default}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #cdd3de}
.btn.danger{background:#fff;color:var(--out);border:1px solid var(--out)}
.btn.big{width:100%;padding:12px;font-size:15px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{margin-top:12px;padding:9px 12px;border-radius:9px;font-size:13px;display:none}
.msg.ok{display:block;background:#e7f5ec;color:#1e7a3c}.msg.err{display:block;background:#fdecea;color:#b3261e}.msg.warn{display:block;background:#fff4d6;color:#8a5a00}
.note{color:var(--muted);font-size:12.5px;margin:6px 0}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:0 0 232px;background:var(--side);color:var(--sideink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .brand{padding:20px 20px 10px;font-weight:800;font-size:22px;color:#fff;letter-spacing:.5px}
#side .brand small{display:block;font-weight:500;font-size:11.5px;color:#8f9bb3;letter-spacing:0}
#side .who{margin:8px 14px 12px;padding:10px 12px;border-radius:10px;background:var(--side2);font-size:12.5px}
#side .who b{color:#fff}
#nav{flex:1;overflow:auto;padding:4px 10px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--sideink);padding:9px 12px;border-radius:9px;text-align:left;margin:1px 0;font-size:13.5px}
#nav button .dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
#nav button:hover{background:var(--side2);color:#fff}
#nav button.on{background:#fff;color:var(--side);font-weight:700}
#nav button.soon{opacity:.55}#nav button.soon::after{content:"soon";margin-left:auto;font-size:10px;border:1px solid #5b6680;border-radius:6px;padding:0 5px}
#nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6f7b94;margin:12px 12px 4px}
#side .foot{padding:10px 14px 14px;font-size:11.5px;color:#8f9bb3;border-top:1px solid #253055}
#side .foot button{width:100%;margin-top:8px;background:var(--side2);color:#fff;border:0;border-radius:8px;padding:8px}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:16px 26px;background:var(--card);border-bottom:4px solid var(--accent)}
#top h2{margin:0;font-size:20px}#top .crumb{color:var(--muted);font-size:12.5px}
#top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
#saveDot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block}
#saveDot.busy{background:#f59e0b}#saveDot.err{background:#ef4444}
#main{padding:22px 26px;max-width:1400px;width:100%}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(20,27,45,.08);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.tile{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,27,45,.08);border-left:5px solid var(--c,var(--accent))}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.tile .v{font-size:26px;font-weight:800;margin-top:4px}.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click:hover td{background:#f6f8fc;cursor:pointer}
.alt2{display:block;font-size:12px;font-style:italic;color:#0f8a63;margin-top:2px}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--line);float:left;margin:0 9px 2px 0;background:#fff;cursor:zoom-in}
.sugg .thumb{width:34px;height:34px;cursor:default}.bigph{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);display:block;margin:10px 0}
#phZoom{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}#phZoom img{max-width:92vw;max-height:92vh;border-radius:10px;background:#fff}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;background:#eef2f7;color:#475569}
.pill.g{background:#e7f5ec;color:#1e7a3c}.pill.r{background:#fdecea;color:#b3261e}.pill.b{background:#e8f0fe;color:#1f6feb}
.search{position:relative;flex:1;min-width:260px}.search input{padding-left:34px;font-size:15px}
.search::before{content:"⌕";position:absolute;left:12px;top:6px;font-size:18px;color:var(--muted)}
.soonbox{text-align:center;padding:50px 20px;color:var(--muted)}.soonbox b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal .box{width:min(620px,100%);max-height:92vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.mono{font-family:Consolas,monospace}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid #cdd3de;background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip b{margin-left:4px}
.lots{font-size:12px;color:var(--muted);margin-top:2px}
.lot{display:inline-block;margin:2px 6px 0 0;padding:1px 7px;border-radius:6px;background:#eef2f7;color:#334155;white-space:nowrap}
.lot.exp{background:#fdecea;color:#b3261e;font-weight:700}.lot.soon{background:#fff4d6;color:#8a5a00}
.qty{font-size:16px;font-weight:800;text-align:right;white-space:nowrap}
.star{background:none;border:0;font-size:18px;color:#c3c9d4;padding:0 4px}.star.on{color:#f5a524}
td.num{text-align:right;white-space:nowrap}
.flag{display:inline-block;font-size:10.5px;font-weight:700;color:#8a5a00;background:#fff4d6;border-radius:6px;padding:1px 6px;margin-left:6px}
.low{display:inline-block;font-size:10.5px;font-weight:700;color:#b3261e;background:#fdecea;border-radius:6px;padding:1px 6px;margin-left:6px}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid #cdd3de;border-radius:10px;box-shadow:0 8px 30px rgba(20,27,45,.15);max-height:380px;overflow:auto;margin-top:4px}
.sugg div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}.sugg div:hover,.sugg div.hl{background:#f2f6fd}
.sugg small{color:var(--muted);display:block}
table.t input,table.t select{padding:6px 8px;font-size:13.5px}
.st-ok{color:#1e7a3c;font-weight:600}.st-mv{color:#8a5a00;font-weight:600}.st-short{color:#b3261e;font-weight:700}.st-err{color:#b3261e;font-weight:700}
tr.errrow td{background:#fff5f5}
.pwwrap{position:relative}.pwwrap input{padding-right:44px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:17px;padding:6px 8px;border-radius:8px;opacity:.55;line-height:1}.eye:hover,.eye.on{opacity:1}
.kbwarn{margin-top:6px;font-size:13px;font-weight:600;color:#8a5a00;background:#fff4d6;border-radius:8px;padding:7px 10px}
.links{margin:14px 0 0;text-align:center;font-size:13px}.links a{color:var(--dash)}
.keybox{font:700 25px/1.3 ui-monospace,Consolas,'Courier New',monospace;letter-spacing:2px;text-align:center;padding:16px 10px;border:2px dashed #b9c2d3;border-radius:12px;margin:14px 0;user-select:all;background:#f8fafc}
body.locked #modal{display:none!important}
#uTab .pill{white-space:nowrap}
#printArea{display:none}@media print{body.printkey>*{display:none!important}body.printkey>#printArea{display:block!important;padding:30px;font-size:15px}body.printkey .keybox{font-size:30px}}
#mTab select.ms{min-width:230px}#mTab input.me{min-width:170px}#mTab input.mq{width:76px}#mTab td.stc{min-width:190px}
#nav button svg{width:18px;height:18px;flex:0 0 18px;stroke:var(--c);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.shelf{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink)}.shelf input{width:74px!important}.shelf input.she{width:118px!important}.shelf .btn{padding:4px 10px}.shelf a{cursor:pointer;text-decoration:underline}
.drafthead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.drafthead h3{margin:0}
.sumbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.filt{align-items:flex-end;gap:10px}.filt>div{display:flex;flex-direction:column}.filt label{margin:0 0 4px}.filt input,.filt select{width:auto}
.reptabs{display:flex;flex-wrap:wrap;gap:6px}.reptabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font-weight:600}.reptabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#cTab input.cq{width:78px}#cTab td.stc{max-width:260px}
</style>
</head>
<body>

<!-- start screens -->
<div id="scr" class="center"><div class="box" id="scrBox"></div></div>

<!-- application -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand">CCS Desk<small id="sideUnit"></small></div>
    <div class="who" id="sideWho"></div>
    <nav id="nav"></nav>
    <div class="foot"><span id="sideVer"></span><button id="lockBtn" type="button" title="Lock the screen; your work stays as it is">Lock</button><button id="logoutBtn" type="button">Sign out</button></div>
  </aside>
  <div id="mainwrap">
    <div id="top"><div><div class="crumb" id="crumb"></div><h2 id="title"></h2></div><div class="right"><span id="saveDot"></span><span id="saveTxt"></span></div></div>
    <main id="main"></main>
  </div>
</div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
const VERSION='1.7';
// ==CORE START==
function pad2(n){return (n<10?'0':'')+n;}
function validYMD(y,m,d){const t=new Date(Date.UTC(y,m-1,d));return y>=2000&&y<=2100&&t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d;}
function lastDay(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
// -> 'YYYY-MM-DD' | null
function parseExpiry(s){
  s=(s||'').trim(); let m;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))){const d=+m[1],mo=+m[2],y=+m[3];return validYMD(y,mo,d)?y+'-'+pad2(mo)+'-'+pad2(d):null;}
  if((m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/))){const y=+m[1],mo=+m[2],d=+m[3];return validYMD(y,mo,d)?y+'-'+pad2(mo)+'-'+pad2(d):null;}
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{4})$/))){const mo=+m[1],y=+m[2];return(mo>=1&&mo<=12&&y>=2000&&y<=2100)?y+'-'+pad2(mo)+'-'+pad2(lastDay(y,mo)):null;}
  if((m=s.match(/^(\d{4})[\/.\-](\d{1,2})$/))){const y=+m[1],mo=+m[2];return(mo>=1&&mo<=12&&y>=2000&&y<=2100)?y+'-'+pad2(mo)+'-'+pad2(lastDay(y,mo)):null;}
  if((m=s.match(/^(\d{2})(\d{2})(\d{4})$/))){const d=+m[1],mo=+m[2],y=+m[3];return validYMD(y,mo,d)?y+'-'+pad2(mo)+'-'+pad2(d):null;}
  if((m=s.match(/^(\d{1,2})[\- ]([A-Za-z]{3,9})[\- ,]*(\d{4})$/))){const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].slice(0,3).toLowerCase());if(mi<0)return null;const d=+m[1],y=+m[3];return validYMD(y,mi+1,d)?y+'-'+pad2(mi+1)+'-'+pad2(d):null;}
  return null;
}
function excelSerial(iso){const p=iso.split('-').map(Number);return Math.round((Date.UTC(p[0],p[1]-1,p[2])-Date.UTC(1899,11,30))/86400000);}
function xmlEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');}
function colLetter(i){let s='';i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;}
let CRC_T=null;
function crc32(b){if(!CRC_T){CRC_T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC_T[n]=c>>>0;}}
  let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // files: [{name, data:Uint8Array}]  (no compression)
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  }
  let csz=0;for(const p of central)csz+=p.length;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(e.buffer)];let tot=0;for(const p of all)tot+=p.length;
  const out=new Uint8Array(tot);let o=0;for(const p of all){out.set(p,o);o+=p.length;}return out;
}
// cols: [[heading,key,type('s'|'n'|'d'),width]], rows: array of objects
function buildXlsx(sheetName,cols,rows,meta){
  const enc=new TextEncoder();
  let sd='<row r="1">'+cols.map((c,i)=>'<c r="'+colLetter(i)+'1" t="inlineStr" s="2"><is><t>'+xmlEsc(c[0])+'</t></is></c>').join('')+'</row>';
  rows.forEach((r,ri)=>{
    const rn=ri+2;
    sd+='<row r="'+rn+'"'+((meta&&meta.rowHt&&meta.rowHt[rn])?' ht="'+meta.rowHt[rn]+'" customHeight="1"':'')+'>'+cols.map((c,i)=>{
      const ref=colLetter(i)+rn,v=r[c[1]];
      if(v===undefined||v===null||v==='')return '';
      if(c[2]==='n')return '<c r="'+ref+'"><v>'+Number(v)+'</v></c>';
      if(c[2]==='d')return '<c r="'+ref+'" s="1"><v>'+excelSerial(v)+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr" s="3"><is><t>'+xmlEsc(v)+'</t></is></c>';
    }).join('')+'</row>';
  });
  const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',rel='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const parts=[
    ['[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+rel+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml',X+'<workbook xmlns="'+ns+'" xmlns:r="'+rel+'"><sheets><sheet name="'+xmlEsc(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+rel+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+rel+'/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml',X+'<styleSheet xmlns="'+ns+'"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd\\-mmm\\-yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
    ['xl/worksheets/sheet1.xml',X+'<worksheet xmlns="'+ns+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+cols.map((c,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+c[3]+'" customWidth="1"/>').join('')+'</cols><sheetData>'+sd+'</sheetData></worksheet>']
  ];
  if(meta){                                                  // who saved it: file author + optional "Info" sheet (second sheet)
    const P=n=>parts.find(p=>p[0]===n);

(function(){

const DATA='ccs_desk_data.json',BKDIR='backups';

// ---------------------------------------------------------------- tiny key/value store (remembers the data folder)
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ccsdesk',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch(e){return undefined;}}
async function kvSet(k,v){try{const d=await idb();await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

// ---------------------------------------------------------------- passwords (PBKDF2, kept only as hashes)
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function pwHash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:120000},k,256));}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
function pwRule(p){return p.length>=8&&p.length<=64&&/[A-Za-z]/.test(p)&&/[0-9]/.test(p)?'':'The password must have at least 8 characters, with letters AND numbers.';}

// ---------------------------------------------------------------- start screens
function screen(html){document.documentElement.style.setProperty('--accent','var(--dash)');$('app').classList.add('hidden');$('scr').classList.remove('hidden');$('scrBox').innerHTML='<div class="logo">CCS <span>Desk</span></div>'+html;}
function smsg(k,t){const m=$('smsg');if(m){m.className='msg '+k;m.textContent=t;}}
function fsOk(){return !!window.__CCSD_TEST_DIR_PROMISE||'showDirectoryPicker' in window;}
async function boot(){
  try{FAILS=(await kvGet('fails'))||{};}catch(e){}

  const h=await kvGet('dir');
  if(!h){welcome();return;}
  if(h==='test'&&window.__CCSD_TEST_DIR_PROMISE){DIR=await window.__CCSD_TEST_DIR_PROMISE;return openFolder();}   // automated tests only

  if(p==='granted')return openFolder();

  $('reBtn').onclick=async()=>{try{const r=await h.requestPermission({mode:'readwrite'});if(r!=='granted'){smsg('err','Permission was not given.');return;}openFolder();}catch(e){smsg('err','Could not open the folder: '+e.message);}};

}
function welcome(){

  $('pickBtn').onclick=chooseFolder;
}
async function chooseFolder(){
  try{const h=window.__CCSD_TEST_DIR_PROMISE?await window.__CCSD_TEST_DIR_PROMISE:await window.showDirectoryPicker({id:'ccsdesk',mode:'readwrite'});
    DIR=h;await kvSet('dir',window.__CCSD_TEST_DIR_PROMISE?'test':h);openFolder();}
  catch(e){if(e&&e.name==='AbortError')return;smsg('err','Could not use this folder: '+(e.message||e.name));}
}
async function openFolder(){
  try{FILEH=await DIR.getFileHandle(DATA);}catch(e){FILEH=null;}
  if(!FILEH){setupScreen();return;}
  try{const f=await FILEH.getFile(),o=JSON.parse(await f.text());if(!o||o.app!=='CCS Desk'||!Array.isArray(o.users))throw new Error('this is not a CCS Desk data file');DB=o;migrate();lastMod=f.lastModified;loginScreen();}
  catch(e){screen('<h1>The data file cannot be read</h1><p class="sub">'+esc(e.message)+'</p><p class="note">Do not delete anything. Restore the newest file from the “backups” folder (rename it to '+DATA+') or ask for help.</p><button class="btn alt big" id="otherBtn">Use another folder…</button>');$('otherBtn').onclick=chooseFolder;}
}

const CORP_RE=/^[A-Z0-9]{3,12}$/,RK_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const daysSince=t=>{const d=new Date(String(t||'').replace(' ','T'));return isNaN(d)?1e9:(Date.now()-d.getTime())/864e5;};
const normU=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const offDays=()=>(DB.settings&&DB.settings.offlineDays)||30;
const idleMin=()=>(DB.settings&&DB.settings.idleMin)||60;
const corpGuess=us=>us.corp||(CORP_RE.test(us.u.toUpperCase())&&/[0-9]/.test(us.u)?us.u.toUpperCase():'');
const signName=us=>us.corp||us.u;
const hasLocal=us=>!!(us.hash&&us.salt&&!us.hashOff);
function migrate(){   // a data file of version 1.4 or older: nothing is removed
  if(!DB.settings)DB.settings={backupDays:30};const s=DB.settings;
  if(!s.v15){s.v15=true;if(!s.idleMin||s.idleMin===15)s.idleMin=60;if(!s.offlineDays)s.offlineDays=30;}
  ['ledger','audit'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
}
function failWait(k){const f=FAILS[k];return f&&f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0;}
function failAdd(k){const f=FAILS[k]=FAILS[k]||{n:0,until:0};f.n++;if(f.n>=5)f.until=Date.now()+Math.min(15,Math.pow(2,f.n-5))*60000;kvSet('fails',FAILS);}
function failClear(k){if(FAILS[k]){delete FAILS[k];kvSet('fails',FAILS);}}
const waitMsg=s=>'Too many wrong tries. Wait '+(s>90?Math.ceil(s/60)+' minutes':s+' seconds')+', then try again.';

// ---- the unit link (where the app accounts are checked): kept in the data file, so every computer of the unit knows it
async function unitList(){
  if(UNITS)return UNITS;if(location.protocol==='file:')return [];
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch('../config.json',{cache:'no-store',signal:ctl.signal}),c=await r.json();
    UNITS=(c.units||[]).filter(u=>u.id&&u.name&&/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.syncUrl||''));return UNITS;}
  catch(e){return [];}finally{clearTimeout(to);}
}
async function unitLink(){
  if(DB.link&&DB.link.url)return DB.link;
  let ph=null;try{ph=await kvGet('phones');}catch(e){}
  if(ph&&ph.url)return DB.link={url:ph.url,unitId:ph.unitId||'',unitName:ph.unitName||DB.unit};
  const u=(await unitList()).find(x=>normU(x.name)===normU(DB.unit));
  return u?(DB.link={url:u.syncUrl,unitId:u.id,unitName:u.name}):null;
}
async function linkPost(L,action,extra,ms){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||15000),net=m=>{const x=new Error(m);x.net=true;return x;};
  try{const r=await fetch(L.url,{method:'POST',body:JSON.stringify(Object.assign({},extra||{},{action},L.unitId?{hubUnit:L.unitId}:{})),redirect:'follow',signal:ctl.signal});let j;
    try{j=await r.json();}catch(e){throw net('the Google Sheet did not answer correctly');}
    if(!j||j.ok!==true)throw new Error((j&&j.error)||'refused');
    return j;}
  catch(e){if(e.name==='AbortError')throw net('no answer from the Google Sheet');if(e instanceof TypeError)throw net('no internet connection');throw e;}
  finally{clearTimeout(to);}
}
async function deskDevice(){let d=await kvGet('device');if(!d){d='ccsdesk'+Math.random().toString(36).slice(2,8);await kvSet('device',d);}return d;}
async function appLogin(corp,pw){
  const L=await unitLink();if(!L){const x=new Error('This CCS Desk is not linked to a unit yet.');x.nolink=true;throw x;}
  return {L,j:await linkPost(L,'login',{corp,password:pw,device:await deskDevice(),unit:L.unitName||DB.unit})};
}
async function appOk(us,j,L,pw){   // a good sign-in with the app account: remember it for offline use, and link this computer to the phones
  us.corp=j.corp;us.app=true;if(!us.name)us.name=j.name||j.corp;
  const salt=newSalt();us.off={salt,hash:await pwHash(pw,salt),at:nowStamp()};
  if(us.hash)us.hashOff=true;delete us.mustChange;delete us.blocked;DB.link=L;
  let ph=null;try{ph=await kvGet('phones');}catch(e){}
  const same=ph&&ph.url===L.url&&(ph.unitId||'')===(L.unitId||'');
  PH=Object.assign({auto:true,linkedAt:nowStamp()},same?ph:{},{url:L.url,unitId:L.unitId||'',unitName:L.unitName||DB.unit,token:j.token,name:j.name,corp:j.corp});await phSave();
}
const offOk=async(us,pw)=>!!(us.off&&us.off.salt&&await pwHash(pw,us.off.salt)===us.off.hash);
const localOk=async(us,pw)=>hasLocal(us)&&await pwHash(pw,us.salt)===us.hash;
async function verify(us,pw,quick){   // -> {ok,how} or {ok:false,msg}
  if(quick)return (await localOk(us,pw)||await offOk(us,pw))?{ok:true,how:'unlock'}:{ok:false,msg:'Wrong password.'};
  if(!us.blocked&&await localOk(us,pw))return {ok:true,how:'CCS Desk password'};
  const corp=corpGuess(us),wrong='Wrong password for '+us.name+'.';
  if(!corp)return {ok:false,msg:wrong};
  try{const {j,L}=await appLogin(corp,pw);
    if(j.role!=='charge')return {ok:false,msg:'The app account '+corp+' is not a charge nurse. In the CCS Scan Helper app: tap your name > I am a charge nurse. Then sign in here again.'};
    await appOk(us,j,L,pw);return {ok:true,how:'app account'};}
  catch(e){const m=e.message||e.name;
    if(e.nolink)return {ok:false,msg:us.app?m:wrong};
    if(e.net){
      if(us.blocked)return {ok:false,msg:'This account was blocked. It can be used again only after a sign-in with internet.'};
      if(!us.off)return {ok:false,msg:us.app?'Could not check the password ('+m+'). The first sign-in with the app account needs the internet.':wrong};
      if(!await offOk(us,pw))return {ok:false,msg:wrong+' (Checked without internet: '+m+'.)'};
      if(daysSince(us.off.at)>offDays())return {ok:false,msg:'No internet, and your last sign-in with internet was more than '+offDays()+' days ago. Connect this computer to the internet and sign in again.'};
      return {ok:true,how:'app account, without internet'};}
    if(/blocked/i.test(m)){us.blocked=true;return {ok:false,dirty:true,msg:'This account is blocked in the Users sheet of the unit Google Sheet. Ask the person who manages it.'};}
    if(/^Wrong password/i.test(m))return {ok:false,msg:wrong+(us.app?'':' Use your CCS Desk password or the password of the CCS Scan Helper app.')};
    if(/^No account/i.test(m))return {ok:false,msg:us.app?'The app account '+corp+' does not exist any more in this unit. Make it again in the CCS Scan Helper app (same Corp No.), then sign in here.':wrong};
    return {ok:false,msg:m};}
}
async function refreshDB(){   // another computer may have saved since this screen was opened
  try{await saving;const f=await FILEH.getFile();if(f.lastModified===lastMod)return;const o=JSON.parse(await f.text());
    if(o&&o.app==='CCS Desk'&&Array.isArray(o.users)){DB=o;migrate();lastMod=f.lastModified;}}catch(e){}
}

// ---- small helpers of the password fields: show/hide, keyboard language, Caps Lock
function pwField(id,ph){return '<div class="pwwrap"><input type="password" id="'+id+'" data-kb autocomplete="off"'+(ph?' placeholder="'+esc(ph)+'"':'')+'><button type="button" class="eye" data-eye="'+id+'" title="Show or hide the password" aria-label="Show or hide the password">&#128065;</button></div><div class="kbwarn hidden" id="'+id+'W"></div>';}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button[data-eye]');if(!b)return;const i=$(b.dataset.eye);if(!i)return;i.type=i.type==='password'?'text':'password';b.classList.toggle('on',i.type==='text');i.focus();});
function kbCheck(e){
  const i=e.target;if(!i||!i.matches||!i.matches('input[data-kb]'))return;const w=$(i.id+'W');if(!w)return;
  if(e.getModifierState)CAPS=e.getModifierState('CapsLock');const t=[];
  if(/[^\x20-\x7E]/.test(i.value)||(e.type==='keydown'&&e.key&&e.key.length===1&&/[^\x20-\x7E]/.test(e.key)))t.push('The keyboard is not English. Change the keyboard language (Alt+Shift or Windows+Space), clear the box and type again.');
  if(CAPS)t.push('Caps Lock is on.');
  w.textContent=t.join(' ');w.classList.toggle('hidden',!t.length);
}
['keydown','keyup','input'].forEach(ev=>document.addEventListener(ev,kbCheck,true));

// ---- sign in
async function loginScreen(kind,text){
  ME=null;LOCKED=false;document.body.classList.remove('locked');
  screen('<h1>Sign in</h1><p class="sub">'+esc(DB.unit)+' · one moment…</p>');
  await refreshDB();const L=await unitLink(),last=(await kvGet('lastUser'))||'';
  const users=DB.users.filter(u=>u.active).sort((a,b)=>a.name.localeCompare(b.name)),join=!!L&&DB.settings.selfJoin!==false;
  screen('<h1>Sign in</h1><p class="sub">'+esc(DB.unit)+' · data folder <b>'+esc(DIR.name)+'</b></p>'
    +'<label for="lWho">Who are you?</label><select id="lWho">'+users.map(u=>'<option value="'+esc(u.u)+'"'+(u.u===last?' selected':'')+'>'+esc(u.name)+' · '+esc(signName(u))+(u.role==='admin'?' (admin)':'')+'</option>').join('')
      +(join?'<option value="+">I am not in this list (charge nurse with the app)…</option>':'')+'</select>'
    +'<div id="lCorpBox" class="hidden"><label for="lCorp">Your Corp No.</label><input type="text" id="lCorp" data-kb autocomplete="off" inputmode="numeric"><div class="kbwarn hidden" id="lCorpW"></div></div>'
    +'<label for="lPw">Password</label>'+pwField('lPw')+'<p class="note" id="lHint" style="margin:6px 0 0"></p>'
    +'<button class="btn big" id="lGo">Sign in</button><div class="msg" id="smsg"></div><p class="links"><a href="#" id="lForgot">Forgot password?</a></p>'
    +(L?'':'<p class="note">Sign-in with the app account is not possible yet: this CCS Desk is not linked to a unit (admin: Settings > Phones).</p>'));
  if(kind)smsg(kind,text);
  const hint=()=>{const w=$('lWho').value,us=DB.users.find(x=>x.u===w);$('lCorpBox').classList.toggle('hidden',w!=='+');
    $('lHint').textContent=w==='+'?'Corp No. and password of your CCS Scan Helper account. Charge nurses only. This first sign-in needs the internet.'
      :!us?'':!hasLocal(us)?'The password of your CCS Scan Helper app.':corpGuess(us)&&L?'Your CCS Desk password, or the password of your CCS Scan Helper app.':'Your CCS Desk password.';};
  hint();$('lWho').onchange=()=>{hint();(($('lWho').value==='+')?$('lCorp'):$('lPw')).focus();};
  let busy=false;
  const go=async()=>{
    if(busy)return;const who=$('lWho').value,pw=$('lPw').value;if(!pw){smsg('err','Type the password.');return;}
    const fail=(m)=>{smsg('err',m);$('lPw').value='';$('lPw').focus();};
    busy=true;$('lGo').disabled=true;smsg('warn','Checking…');
    try{
      await refreshDB();let us=null,how='';
      if(who==='+'){
        const corp=fixDigits($('lCorp').value).trim().toUpperCase();if(!CORP_RE.test(corp)){fail('Type your Corp No. (letters and numbers only).');return;}
        us=DB.users.find(x=>String(x.corp||'').toUpperCase()===corp||x.u.toUpperCase()===corp)||null;
        if(us&&!us.active){fail('This user is switched off in CCS Desk. Ask the admin (Users page).');return;}
        if(!us){
          const k='+'+corp,w=failWait(k);if(w){fail(waitMsg(w));return;}
          let r;try{r=await appLogin(corp,pw);}catch(e){if(!e.net&&!e.nolink)failAdd(k);fail(e.net?'Could not check the app account: '+e.message+'. The first sign-in needs the internet.':e.message);return;}
          if(r.j.role!=='charge'){fail('This app account is not a charge nurse. In the CCS Scan Helper app: tap your name > I am a charge nurse. Then sign in here again.');return;}
          us={u:corp.toLowerCase(),name:r.j.name||corp,role:'charge',active:true,created:nowStamp(),last:''};await appOk(us,r.j,r.L,pw);DB.users.push(us);
          ME=us;audit('USER_ADD',us.u+' ('+us.name+', charge nurse): first sign-in with the app account');how='app account';failClear(k);
        }
      }else us=DB.users.find(x=>x.u===who&&x.active)||null;
      if(!us){loginScreen('err','The list of users changed. Choose your name again.');return;}
      if(!ME){
        const w=failWait(us.u);if(w){fail(waitMsg(w));return;}
        const r=await verify(us,pw);
        if(!r.ok){failAdd(us.u);audit('LOGIN_FAIL',signName(us)+' ('+us.name+')');save();fail(r.msg+(failWait(us.u)?' '+waitMsg(failWait(us.u)):''));return;}
        ME=us;how=r.how;failClear(us.u);
      }
      kvSet('lastUser',ME.u);
      if(ME.mustChange){changePwScreen(true);return;}
      ME.last=nowStamp();audit('LOGIN',how);await save();enterApp();
    }catch(e){fail('Sign-in failed: '+(e.message||e.name));}
    finally{busy=false;if($('lGo'))$('lGo').disabled=false;}
  };
  $('lGo').onclick=go;$('lPw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});$('lCorp').addEventListener('keydown',e=>{if(e.key==='Enter')$('lPw').focus();});
  $('lForgot').onclick=e=>{e.preventDefault();forgotScreen($('lWho').value);};
  setTimeout(()=>{const f=$('lWho')&&$('lWho').value==='+'?$('lCorp'):$('lPw');if(f)f.focus();},50);
}

  screen('<h1>'+(first?'Choose your own password':'Change password')+'</h1><p class="sub">'+esc(ME.name)+(app?' · this also changes the password of your CCS Scan Helper app':'')+'</p>'
    +(first?'':'<label>Current password</label>'+pwField('cOld'))+'<label>New password</label>'+pwField('cNew')+'<label>New password again</label>'+pwField('cNew2')
    +'<p class="note">At least 8 characters, with letters and numbers.</p><button class="btn big" id="cGo">Save password</button>'+(first?'':'<button class="btn alt big" id="cBack" style="margin-top:8px">Cancel</button>')+'<div class="msg" id="smsg"></div>');
  if(!first)$('cBack').onclick=startApp;
  $('cGo').onclick=async()=>{
    const old=first?'':$('cOld').value,p=$('cNew').value,r=pwRule(p);
    if(!first&&!app&&!await localOk(ME,old)){smsg('err','The current password is wrong.');return;}
    if(r){smsg('err',r);return;}if(p!==$('cNew2').value){smsg('err','The two passwords are not the same.');return;}
    $('cGo').disabled=true;
    try{
      if(app){smsg('warn','Changing the password of the app account…');const L=await unitLink(),j=await linkPost(L,'login',{corp:corpGuess(ME),password:old,device:await deskDevice(),unit:L.unitName||DB.unit});
        await linkPost(L,'changePw',{code:j.token,old,password:p});await appOk(ME,j,L,p);audit('PASSWORD','Own app password changed');}
      else{ME.salt=newSalt();ME.hash=await pwHash(p,ME.salt);delete ME.hashOff;delete ME.mustChange;audit('PASSWORD','Own password changed');}
      ME.last=nowStamp();await save();if(first)enterApp();else{startApp();go('set');}
    }catch(e){smsg('err',e.net?'Could not change it: '+e.message+'. The app password can only be changed with internet.':(e.message||e.name));}
    finally{if($('cGo'))$('cGo').disabled=false;}
  };
}

// ---- recovery key
function newKey(){const b=crypto.getRandomValues(new Uint8Array(16));let s='';for(let i=0;i<16;i++)s+=RK_ABC[b[i]%32];return s.replace(/(.{4})(?=.)/g,'$1-');}
const normKey=k=>String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function printKey(key){
  let a=$('printArea');if(!a){a=document.createElement('div');a.id='printArea';document.body.appendChild(a);}
  a.innerHTML='<h1>CCS Desk recovery key</h1><p>Unit: <b>'+esc(DB.unit)+'</b> &nbsp; Made: '+esc(disp(nowStamp()))+' by '+esc(ME.name)+'</p><div class="keybox">'+esc(key)+'</div>'
    +'<p><b>How to use it:</b> CCS Desk sign-in screen &gt; Forgot password? &gt; type this key, choose the user, type a new password.</p>'
    +'<p>Keep this paper locked away. Whoever has this key can sign in to CCS Desk of this unit as any user. A new key can be made in Settings &gt; Unit and safety; the old key then stops working.</p>';
  document.body.classList.add('printkey');const done=()=>document.body.classList.remove('printkey');window.addEventListener('afterprint',done,{once:true});setTimeout(done,120000);window.print();
}
function recoveryScreen(first){
  const key=newKey();
  screen('<h1>Recovery key</h1><p class="sub">'+(first?'Keep this key on paper. It is the way back in when a password is forgotten.':'This is a new key. The old key stops working when you press Continue.')+'</p>'
    +'<div class="keybox" id="rkKey">'+key+'</div>'
    +'<p>With this key, a forgotten password can be reset on the sign-in screen (<b>Forgot password?</b>) for any user, also the admin. It is shown <b>only now</b>.</p>'
    +'<div class="row"><button class="btn alt" id="rkPrint" type="button">Print</button><button class="btn alt" id="rkCopy" type="button">Copy</button></div>'

function audit(a,d){DB.audit.push({t:nowStamp(),u:ME?ME.u:'',a,d:String(d||'').slice(0,300)});if(DB.audit.length>20000)DB.audit.splice(0,DB.audit.length-20000);}
function saveState(k,t){const d=$('saveDot');if(d){d.className=k;$('saveTxt').textContent=t;}}
function save(first){
  saving=saving.then(async()=>{
    saveState('busy','Saving…');
    try{
      if(!first&&lastMod){const f=await FILEH.getFile();if(f.lastModified!==lastMod){conflict();throw new Error('changed elsewhere');}}
      DB.savedAt=nowStamp();DB.savedBy=ME?ME.u:'';
      const w=await FILEH.createWritable();await w.write(JSON.stringify(DB));await w.close();
      lastMod=(await FILEH.getFile()).lastModified;
      await dailyBackup();
      saveState('','Saved '+DB.savedAt.slice(11,16));
    }catch(e){saveState('err','NOT saved');if(e.message!=='changed elsewhere')alert('The data could NOT be saved: '+(e.message||e.name)+'\n\nCheck that the OneDrive folder is available, then try again.');throw e;}
  }).catch(()=>{});
  return saving;
}
function conflict(){
  $('modalBox').innerHTML='<h1>The data file was changed somewhere else</h1><p class="sub">Another computer or window saved the data file after you opened it. Your last change was <b>not</b> saved, so nothing is overwritten.</p><p class="note">Use CCS Desk on one computer at a time. Press “Reload” to load the newest data, then do your last change again.</p><button class="btn big" id="cfReload">Reload</button>';
  $('modal').classList.remove('hidden');$('cfReload').onclick=()=>location.reload();

async function bkDir(){return DIR.getDirectoryHandle(BKDIR,{create:true});}
async function writeBackup(name){const d=await bkDir(),h=await d.getFileHandle(name,{create:true}),w=await h.createWritable();await w.write(JSON.stringify(DB));await w.close();}
async function listBackups(){const d=await bkDir(),out=[];for await(const [n,h] of d.entries()){if(h.kind==='file'&&/^ccs_desk_data_.*\.json$/.test(n)){const f=await h.getFile();out.push({name:n,size:f.size,t:f.lastModified});}}return out.sort((a,b)=>b.name.localeCompare(a.name));}
async function dailyBackup(){
  const name='ccs_desk_data_'+today()+'.json',d=await bkDir();
  try{await d.getFileHandle(name);return;}catch(e){}
  await writeBackup(name);
  const keep=(DB.settings&&DB.settings.backupDays)||30,daily=(await listBackups()).filter(b=>/^ccs_desk_data_\d{4}-\d{2}-\d{2}\.json$/.test(b.name));
  for(const b of daily.slice(keep)){try{await d.removeEntry(b.name);}catch(e){}}
}

function addDays(n){const d=new Date(Date.now()+n*86400000);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function lotsOf(ir){return Object.keys(DB.stock).filter(k=>k.startsWith(ir+'|')&&DB.stock[k]).map(k=>({exp:k.slice(ir.length+1),qty:DB.stock[k]})).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'));}

    +short.map((s,j)=>'<tr><td><b>'+esc(s.name)+'</b><div class="lots mono">'+esc(s.ir)+'</div></td><td class="num">'+s.have+'</td><td class="num">'+s.take+'</td><td><input type="number" min="0" id="sh'+j+'" placeholder="empty = 0"></td></tr>').join('')+'</table>'
    +'<p class="note">These items will be marked “needs a real count”.</p><div class="row" style="margin-top:14px"><button class="btn" id="shOk">Post</button><button class="btn alt" id="shNo">Cancel - post nothing</button></div><div class="msg" id="mmsg"></div>');
  $('shNo').onclick=()=>{closeModal();res(null);};

function planPost(entries,resolve,rexp){

  entries.forEach(e=>{if(!per.has(e.ir)){per.set(e.ir,{ins:0,outs:0,firstExp:null});order.push(e.ir);}const p=per.get(e.ir);if(e.type==='IN')p.ins+=e.qty;else{p.outs+=e.qty;if(p.firstExp===null)p.firstExp=e.exp;}});
  const tot=ir=>Object.keys(st).filter(k=>k.startsWith(ir+'|')).reduce((a,k)=>a+st[k],0);
  const short=[];order.forEach(ir=>{const p=per.get(ir),have=tot(ir);p.after=have+p.ins-p.outs;if(p.after<0&&!(resolve&&ir in resolve)){const it=DB.items.find(i=>i.ir===ir);short.push({ir,name:it?it.name:ir,have,take:p.outs-p.ins});}});
  if(short.length)return{short};
  const led=[],flags=[],now=nowStamp();let moved=0;
  const lot=(ir,e)=>{const k=ir+'|'+(e||'');if(!(k in st))st[k]=0;return k;};
  order.forEach(ir=>{const p=per.get(ir);if(p.after>=0)return;const v=resolve[ir],shelf=v>=0?v:0,adj=shelf-p.after,ax=(rexp&&rexp[ir]!=null&&rexp[ir]!=='')?rexp[ir]:p.firstExp,k=lot(ir,ax);
    st[k]+=adj;led.push({type:'ADJ',ir,exp:ax||'',qty:adj,bal:st[k],note:v>=0?'Approximate count when posting: '+shelf+' left on the shelf':'Could not count when posting: stock set to 0'});
    flags.push({ir,reason:v>=0?'Approximate count ('+shelf+' on the shelf) when a list was posted':'Stock was not enough and set to 0 when a list was posted'});});
  entries.forEach(e=>{
    if(e.type==='IN'){const k=lot(e.ir,e.exp);st[k]+=e.qty;led.push({type:'IN',ir:e.ir,exp:e.exp,qty:e.qty,bal:st[k],by:e.by,note:e.note,pre:e.pre,sc:e.sc,imp:e.imp});return;}
    let rem=e.qty;const k0=lot(e.ir,e.exp),t0=Math.min(rem,Math.max(st[k0],0));
    if(t0>0){st[k0]-=t0;rem-=t0;led.push({type:e.type,ir:e.ir,exp:e.exp,qty:-t0,bal:st[k0],by:e.by,note:e.note,pre:e.pre,sc:e.sc,imp:e.imp});}
    Object.keys(st).filter(k=>k.startsWith(e.ir+'|')&&k!==k0&&st[k]>0).sort((a,b)=>(a.split('|')[1]||'9999').localeCompare(b.split('|')[1]||'9999')).forEach(k=>{
      if(rem<=0)return;const u=Math.min(rem,st[k]);st[k]-=u;rem-=u;moved++;

    if(rem>0)throw new Error('stock calculation error for '+e.ir);

}

async function importCount(draw){
  const f=$('cFile').files&&$('cFile').files[0];if(!f)return;const pm=(k,t)=>{$('pmsg').className='msg '+k;$('pmsg').textContent=t;};
  try{const buf=await f.arrayBuffer(),hash=await fileHash(buf),sheets=await xlsxSheets(buf);let rows=null,sn='',byC=null;
    for(const s0 of sheets){const r=stockRowsFrom(s0.rows);if(r&&r.length){rows=r;sn=s0.name;
      const hi=s0.rows.findIndex(x=>(x||[]).some(v=>/^ir[ _.]?(number|no)?$/i.test(String(v||'').trim())));const hr=(s0.rows[hi]||[]).map(v=>String(v||'').trim().toLowerCase());byC=hr.findIndex(v=>/^(counted by|scanned by|by)$/.test(v));
      if(byC>=0){let k=0;for(let j=hi+1;j<s0.rows.length&&k<r.length;j++){const x=s0.rows[j];if(!x)continue;let ir=x[hr.findIndex(v=>/^ir[ _.]?(number|no)?$/.test(v))];if(typeof ir==='number')ir=String(Math.round(ir));if(String(ir||'').trim()===r[k].ir){r[k].by=String(x[byC]||'').slice(0,40);k++;}}}
      break;}}
    if(!rows){pm('err','No sheet with the columns “IR number” and “Qty” was found in '+f.name+'.');return;}
    const prev=(DB.imports||[]).find(x=>x.hash===hash);
    if(prev&&!confirm('THIS FILE WAS ALREADY POSTED\n\n'+f.name+'\nPosted on '+disp(prev.t)+' by '+prev.u+'.\n\nAdd it to the count list anyway?'))return;
    if(CDRAFT.lines.some(l=>l.hash===hash)){pm('warn','This file is already in the count list.');return;}
    const known=new Set(DB.items.map(i=>i.ir));let added=0,repl=0,unk=0;
    const merged=new Map();rows.forEach(r=>{const k=r.ir+'|'+r.exp;if(merged.has(k))merged.get(k).qty+=r.qty;else merged.set(k,Object.assign({},r));});
    const irs=new Set([...merged.values()].map(r=>r.ir));
    irs.forEach(ir=>{if(CDRAFT.lines.some(l=>l.ir===ir)){CDRAFT.lines=CDRAFT.lines.filter(l=>l.ir!==ir);repl++;}});
    merged.forEach(r=>{const l={ir:r.ir,exp:r.exp,qty:r.qty,name:r.name,by:r.by||'',src:'file',file:f.name,hash};if(!known.has(r.ir)){l.err='not in the master list (add it in Items first)';unk++;}CDRAFT.lines.push(l);added++;});
    draw();pm(unk?'warn':'ok','Added '+irs.size+' item'+(irs.size===1?'':'s')+' ('+added+' expiry lines) from '+f.name+' (sheet “'+sn+'”)'+(repl?', '+repl+' item'+(repl===1?'':'s')+' replaced the lines already in the list':'')+(unk?'. '+unk+' line'+(unk===1?'':'s')+' not in the master list (red, not posted)':'')+'. Check the differences, then press Post count.');}
  catch(e){pm('err','Could not read '+f.name+': '+(e.message||e.name));}
}
async function postCount(draw){
  if(!canEdit())return;const pm=(k,t)=>{$('pmsg').className='msg '+k;$('pmsg').textContent=t;};
  const byIr=new Map();CDRAFT.lines.forEach(l=>{if(!byIr.has(l.ir))byIr.set(l.ir,[]);byIr.get(l.ir).push(l);});
  const bad=[...byIr.keys()].filter(ir=>byIr.get(ir).some(l=>l.err)),miss=[...byIr.keys()].filter(ir=>!bad.includes(ir)&&byIr.get(ir).some(l=>l.qty===''));
  if(miss.length){pm('err',miss.length+' item'+(miss.length===1?' has':'s have')+' a line without a counted qty (type 0 if there is none).');return;}
  const ok=[...byIr.keys()].filter(ir=>!bad.includes(ir));if(!ok.length){pm('err','Nothing to post.');return;}
  const zero=CDRAFT.full?DB.items.filter(i=>!byIr.has(i.ir)&&totalOf(i.ir)>0).map(i=>i.ir):[];
  const big=ok.filter(ir=>bigDiff(totalOf(ir),byIr.get(ir).reduce((a,l)=>a+l.qty,0)));
  if(big.length){const go=await new Promise(res=>{modal('<h1>Big differences</h1><p class="sub">These items differ by more than 20% (and at least 3 units) from the stock in CCS Desk. Please check them on the shelf before posting.</p><table class="t"><tr><th>Item</th><th style="text-align:right">System</th><th style="text-align:right">Counted</th><th style="text-align:right">Difference</th></tr>'
      +big.map(ir=>{const s=totalOf(ir),c=byIr.get(ir).reduce((a,l)=>a+l.qty,0),it=itemOf(ir);return '<tr><td><b>'+esc(it?it.name:ir)+'</b><div class="lots mono">'+esc(ir)+'</div></td><td class="num">'+s+'</td><td class="num">'+c+'</td><td class="num st-err">'+(c-s>0?'+':'')+(c-s)+'</td></tr>';}).join('')+'</table>'
      +'<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="bgOk"> I checked these items</label><div class="row" style="margin-top:12px"><button class="btn" id="bgGo">Post the count</button><button class="btn alt" id="bgNo">Back - check again</button></div><div class="msg" id="mmsg"></div>');
    $('bgNo').onclick=()=>{closeModal();res(false);};$('bgGo').onclick=()=>{if(!$('bgOk').checked){mmsg('err','Tick “I checked these items” first.');return;}closeModal();res(true);};});
    if(!go){pm('warn','Not posted. Check the items with a big difference.');return;}}
  const units=ok.reduce((a,ir)=>a+byIr.get(ir).reduce((b,l)=>b+l.qty,0),0);
  if(!confirm('POST INVENTORY COUNT\n\n'+ok.length+' counted item'+(ok.length===1?'':'s')+' · '+units+' units counted'+(bad.length?'\n'+bad.length+' item'+(bad.length===1?'':'s')+' with errors stay in the list (not posted)':'')+(zero.length?'\n\nFULL COUNT: '+zero.length+' other item'+(zero.length===1?'':'s')+' with stock become 0!':'')+'\n\nThe stock of these items is REPLACED by the count. Continue?'))return;
  const now=nowStamp(),ref='CNT-'+now.replace(/\D/g,'').slice(0,14),note=$('cNote').value.trim().slice(0,120),st=Object.assign({},DB.stock),led=[];
  const apply=(ir,lots,by)=>{const sc=(lots.find(l=>l.sc)||{}).sc||undefined,nw=new Map();lots.forEach(l=>nw.set(l.exp||'',(nw.get(l.exp||'')||0)+l.qty));
    const old=new Map(Object.keys(st).filter(k=>k.startsWith(ir+'|')).map(k=>[k.slice(ir.length+1),st[k]]));let any=false;
    new Set([...old.keys(),...nw.keys()]).forEach(e=>{const o=old.get(e)||0,n=nw.get(e)||0,k=ir+'|'+e;if(n)st[k]=n;else delete st[k];if(n!==o){any=true;led.push({type:'COUNT',ir,exp:e,qty:n-o,bal:n,by,sc,note:(note?note+' · ':'')+'counted '+n+(o?' (was '+o+')':'')});}});
    if(!any)led.push({type:'COUNT',ir,exp:'',qty:0,bal:[...nw.values()].reduce((a,b)=>a+b,0),by,sc,note:(note?note+' · ':'')+'counted - same as the stock'});};
  ok.forEach(ir=>{const L=byIr.get(ir);apply(ir,L,(L.find(l=>l.by)||{}).by||ME.name);});
  zero.forEach(ir=>apply(ir,[],ME.name));
  led.forEach(x=>{DB.seq++;x.id=DB.seq;x.t=now;x.posted=ME.u;x.ref=ref;DB.ledger.push(x);});
  [...ok,...zero].forEach(ir=>{delete DB.flags[ir];});DB.stock=st;
  if(!DB.imports)DB.imports=[];const seen=new Set();CDRAFT.lines.forEach(l=>{if(l.hash&&!l.err&&!seen.has(l.hash)){seen.add(l.hash);DB.imports.push({hash:l.hash,file:l.file,kind:'cnt',t:now,u:ME.u,ref});}});
  const diff=led.reduce((a,x)=>a+x.qty,0);
  audit('POST_COUNT',ref+': '+ok.length+' items'+(zero.length?', '+zero.length+' set to 0 (full count)':'')+', difference '+(diff>0?'+':'')+diff);
  await save();phStockSoon();CDRAFT.lines=CDRAFT.lines.filter(l=>bad.includes(l.ir));CDRAFT.full=false;$('cFull').checked=false;$('cNote').value='';draw();PAGES.cnt.last();
  pm('ok','Count posted ('+ref+'): '+ok.length+' item'+(ok.length===1?'':'s')+(zero.length?', '+zero.length+' other items set to 0':'')+'. Difference: '+(diff>0?'+':'')+diff+' units. “Needs a real count” cleared for these items.');
}

// ---------------------------------------------------------------- restore a backup (admin)
async function restoreBackup(name){
  const d=await bkDir(),h=await d.getFileHandle(name),txt=await (await h.getFile()).text();let o;
  try{o=JSON.parse(txt);}catch(e){throw new Error('the backup file is damaged');}
  if(!o||o.app!=='CCS Desk'||!Array.isArray(o.users)||!Array.isArray(o.items)||typeof o.stock!=='object')throw new Error('this is not a CCS Desk data file');
  if(!o.users.some(u=>u.role==='admin'&&u.active))throw new Error('the backup has no active admin');
  const safe='ccs_desk_data_before_restore_'+nowStamp().replace(/\D/g,'').slice(0,12)+'.json';await writeBackup(safe);
  const me=ME,rk=DB.recovery,lk=DB.link;DB=o;['ledger','audit','imports','pins'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});if(!DB.flags)DB.flags={};if(rk)DB.recovery=rk;if(lk&&!DB.link)DB.link=lk;migrate();
  ME=DB.users.find(u=>u.u===me.u&&u.active)||null;audit('RESTORE',name+' (the data before it: '+BKDIR+'/'+safe+')');await save(true);phStockSoon();
  return{safe,still:!!ME};
}

// ---------------------------------------------------------------- PHONES: link to the CCS Scan Helper app (the unit's Google Sheet)
// The link is kept on THIS computer only (not in the data file): unit, web app link, and the sign-in of a charge nurse account.
let PH=null,phStockT=null;
async function phInit(){try{PH=(await kvGet('phones'))||null;}catch(e){PH=null;}phRetryMarks();}
async function phSave(){try{await kvSet('phones',PH);}catch(e){}}
const phOk=()=>!!(PH&&PH.url&&PH.token);
async function phPost(action,extra,ms){
  if(!PH||!PH.url)throw new Error('CCS Desk is not linked to the phones yet (Settings > Phones).');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||30000);
  try{const body=Object.assign({},extra||{},{action},PH.token&&!('code' in (extra||{}))?{code:PH.token}:{},PH.unitId?{hubUnit:PH.unitId}:{});
    const r=await fetch(PH.url,{method:'POST',body:JSON.stringify(body),redirect:'follow',signal:ctl.signal});let j;
    try{j=await r.json();}catch(e){throw new Error('the Google Sheet link did not answer correctly');}
    if(!j||j.ok!==true){const m=(j&&j.error)||'refused';if(/^signed out/i.test(m)&&PH){PH.token='';phSave();}throw new Error(m);}
    return j;}
  catch(e){if(e.name==='AbortError')throw new Error('no answer from the Google Sheet (internet?)');if(e instanceof TypeError)throw new Error('no internet connection');throw e;}
  finally{clearTimeout(to);}
}
function phBtn(id,label){return phOk()?'<button class="btn alt" id="'+id+'" title="Lists scanned with the CCS Scan Helper app">'+label+'</button>':'';}
// ---- after a posting: tell the phones these lines are done (they leave the SHARED list); kept in the data file until it works
function phAfterPost(lines,ref){
  if(!DB.phoneDone)DB.phoneDone={lines:[],refs:[]};if(!DB.phoneDone.fps)DB.phoneDone.fps=[];lines.forEach(l=>{if(l.fp)DB.phoneDone.fps.push(l.fp);});if(DB.phoneDone.fps.length>20000)DB.phoneDone.fps.splice(0,DB.phoneDone.fps.length-20000);DB.phoneDone.refs.push(ref);lines.forEach(l=>{if(l.src==='phonex'&&l.lineId)DB.phoneDone.lines.push(l.lineId);});
  if(DB.phoneDone.lines.length>20000)DB.phoneDone.lines.splice(0,DB.phoneDone.lines.length-20000);if(DB.phoneDone.refs.length>3000)DB.phoneDone.refs.splice(0,DB.phoneDone.refs.length-3000);
  const items=lines.filter(l=>l.src==='phone'&&l.key).map(l=>({key:l.key,ir:l.ir,expiry:l.pexp||'',qty:Math.min(l.qty,l.pqty||l.qty)}));
  if(!items.length){save();return;}if(!DB.markQueue)DB.markQueue=[];DB.markQueue.push({ref,items,t:nowStamp()});save();phRetryMarks();
}
async function phRetryMarks(){
  if(!DB||!DB.markQueue||!DB.markQueue.length||!phOk())return;
  for(const m of DB.markQueue.slice()){try{await phPost('mark',{status:'EXPORTED',exportId:m.ref,items:m.items});DB.markQueue=DB.markQueue.filter(x=>x!==m);await save();}
    catch(e){saveState('err','Phones not updated: '+(e.message||e.name));return;}}
}
// ---- the stock goes to the phones (they show "In the store: …")
function phStockSoon(){if(!phOk()||PH.auto===false)return;clearTimeout(phStockT);phStockT=setTimeout(()=>phSendStock(false),3000);}
async function phSendStock(show){
  const st={};Object.keys(DB.stock).forEach(k=>{if(!DB.stock[k])return;const i=k.indexOf('|'),ir=k.slice(0,i);(st[ir]=st[ir]||{lots:[]}).lots.push({exp:k.slice(i+1),qty:DB.stock[k]});});
  try{const j=await phPost('stockSet',{stock:st},60000);PH.stockAt=j.at;phSave();if(show)return j;}
  catch(e){saveState('err','Stock not sent to the phones: '+(e.message||e.name));if(show)throw e;}

async function phPullMov(kind,draw){

  try{const j=await phPost('list',{mode:kind==='in'?'IN':kind==='out'?'OUT':'WO'});const known=new Set(DB.items.map(i=>i.ir)),fpd=fpSet();let n=0,skip=0,bad=0,dup=0;const who=new Set();
    (j.batches||[]).forEach(b=>(b.lines||[]).forEach(l=>{
      const fp=fpOf(l.ir,l.expiry,l.qty,l.scanned,b.by);if(fp&&(fpd.has(fp)||DRAFT[kind].some(x=>x.fp===fp))){dup++;return;}
      if(DRAFT[kind].some(x=>x.src==='phone'&&x.key===b.key&&x.ir===l.ir&&x.pexp===(l.expiry||''))){skip++;return;}
      const row={ir:l.ir,exp:l.expiry||'',pexp:l.expiry||'',qty:l.qty,pqty:l.qty,name:l.name||'',by:b.by||'',sc:l.scanned||'',fp:fpOf(l.ir,l.expiry,l.qty,l.scanned,b.by),src:'phone',key:b.key,wo:kind==='wo'?(+String(b.mode).slice(2)||woDefault):0};
      if(!known.has(l.ir)){row.err='not in the master list (add it in Items first)';bad++;}
      DRAFT[kind].push(row);n++;if(b.by)who.add(b.by);}));
    let nx=0;try{const since=[DB.stockSince||'',PH.linkedAt||''].sort().pop()||addDays(-14),done=DB.phoneDone||{lines:[],refs:[]},dl=new Set(done.lines),dr=new Set(done.refs),want=kind==='in'?m=>m==='IN':kind==='out'?m=>m==='OUT':m=>/^WO[1-5]$/.test(m);
      const x=await phPost('imported',{since});(x.exports||[]).forEach(g=>{if(dr.has(g.exportId))return;g.lines.forEach(l=>{if(!want(l.mode)||dl.has(l.lineId)||DRAFT[kind].some(y=>y.lineId===l.lineId))return;const fp=fpOf(l.ir,l.expiry,l.qty,l.scanned,l.by);if(fp&&(fpd.has(fp)||DRAFT[kind].some(y=>y.fp===fp))){dup++;return;}

        if(!known.has(l.ir)){row.err='not in the master list (add it in Items first)';bad++;}DRAFT[kind].push(row);nx++;if(l.by)who.add(l.by);});});}

  catch(e){pm('err','Could not get the lists of the phones: '+(e.message||e.name));}
}
// ---- Inventory Count: take the counts of the phones newer than the last count posted here
async function phPullCount(draw){
  const pm=(k,t)=>{$('pmsg').className='msg '+k;$('pmsg').textContent=t;};pm('warn','Getting the counts of the phones…');
  try{const j=await phPost('counts',{}),c=j.counts||{},known=new Set(DB.items.map(i=>i.ir)),since=addDays(-31),lastCnt=new Map();

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Svg(txt){
  const v=[104];for(const ch of txt){const c=ch.charCodeAt(0)-32;if(c<0||c>94)continue;v.push(c);}
  let sum=v[0];for(let i=1;i<v.length;i++)sum+=v[i]*i;v.push(sum%103,106);
  let x=10,bars='';v.forEach(k=>{const p=C128[k];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="50"/>';x+=w;}});
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+10)+' 50" preserveAspectRatio="none" style="width:100%;height:13mm">'+bars+'</svg>';
}

    +list.map(it=>'<div class="l"><div class="n">'+esc(it.name)+'</div>'+code128Svg(it.ir)+'<div class="i">'+esc(it.ir)+'</div><div class="o">'+esc([it.unit,it.loc].filter(Boolean).join(' · '))+'</div></div>').join('')+'</div></body></html>');

async function loadMaster(){
  const f=$('iFile').files&&$('iFile').files[0];if(!f)return;const pm=(k,t)=>{$('pmsg').className='msg '+k;$('pmsg').textContent=t;};
  try{const r=await parseXlsxCatalog(await f.arrayBuffer()),by=new Map(DB.items.map(i=>[i.ir,i]));let add=0,upd=0,same=0;const nw=[];
    r.items.forEach(a=>{const o={ir:a[0],name:a[1],unit:a[2]||'',loc:a[3]||'',price:a[4],max:a[5],min:a[6],alias:a[8]||''},old=by.get(o.ir);
      if(!old){add++;nw.push(o);return;}const ch=['name','unit','loc','price','max','min','alias'].some(k=>String(old[k]==null?'':old[k])!==String(o[k]==null?'':o[k]));ch?upd++:same++;});
    const keep=DB.items.filter(i=>!r.items.some(a=>a[0]===i.ir)).length;
    if(!confirm('LOAD MASTER LIST\n\n'+f.name+' (sheet “'+r.sheet+'”): '+r.items.length+' items\n\nNew items: '+add+'\nChanged items (name, unit, location, price, min/max, other names): '+upd+'\nUnchanged: '+same+'\nItems of the app that are not in the file (kept): '+keep+'\n\nContinue?'))return;
    r.items.forEach(a=>{const o={ir:a[0],name:a[1],unit:a[2]||'',loc:a[3]||'',price:a[4],max:a[5],min:a[6],alias:a[8]||''},old=by.get(o.ir);if(old)Object.assign(old,o);});
    DB.items.push(...nw);audit('MASTER_LOAD',f.name+': '+add+' new, '+upd+' changed');await save();go('items');pm('ok','Master list loaded: '+add+' new, '+upd+' changed, '+same+' unchanged.');}
  catch(e){pm('err','Could not read '+f.name+': '+(e.message||e.name));}

    +(adm?'<div class="card"><h3>Unit and safety</h3><div class="grid2"><div><label>Unit name</label><input type="text" id="sUnit" value="'+esc(DB.unit)+'"></div><div><label>Lock the screen after … minutes without use</label><input type="number" id="sIdle" min="2" max="240" value="'+idleMin()+'"></div>'
      +'<div><label>Sign-in without internet: for … days after the last sign-in with internet</label><input type="number" id="sOff" min="1" max="365" value="'+offDays()+'"></div></div>'
      +'<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="sJoin"'+(DB.settings.selfJoin!==false?' checked':'')+'> A charge nurse of the unit can sign in the first time with the app account, without being added by an admin</label>'
      +'<button class="btn" id="sSave" style="margin-top:12px">Save</button>'
      +'<p style="margin:18px 0 8px"><b>Recovery key:</b> '+(DB.recovery?'made '+esc(disp(DB.recovery.made))+' by '+esc(DB.recovery.by)+(DB.recovery.used?' · last used '+esc(disp(DB.recovery.used)):' · never used'):'not made yet')+'</p><button class="btn alt" id="sKey">Make a new recovery key…</button>'
      +'<p class="note">App accounts are checked in: '+(DB.link?esc(DB.link.unitName||DB.unit)+(DB.link.unitId?' ('+esc(DB.link.unitId)+')':''):'not linked yet (use the Phones card above)')+'.</p></div>':'')
    +'<div class="card"><h3>Recent changes</h3><table class="t" id="sAud"></table></div>';
  const pm=(k,t)=>{$('pmsg').className='msg '+k;$('pmsg').textContent=t;};
  const showBk=async()=>{try{const b=await listBackups();$('sBkList').innerHTML=(b.length?'Newest backups: '+b.slice(0,6).map(x=>esc(x.name)).join(' · ')+(b.length>6?' · …':''):'No backup yet.')
      +(adm&&b.length?'<div class="row" style="margin-top:10px"><select id="sRestSel" style="width:auto">'+b.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><button class="btn danger" id="sRest">Restore this backup…</button></div>':'');
    if($('sRest'))$('sRest').onclick=async()=>{const nm=$('sRestSel').value;if(!confirm('RESTORE A BACKUP\n\n'+nm+'\n\nAll the data (stock, log, users, items) goes back to that backup. Everything done after it is lost.\nThe current data is saved first as a backup, so you can go back.\n\nContinue?'))return;
      try{const r=await restoreBackup(nm);if(!r.still){alert('Restored. Your user does not exist in that backup: sign in again.');location.reload();return;}startApp();go('set');setTimeout(()=>{const m=$('pmsg');if(m){m.className='msg ok';m.textContent='Restored '+nm+'. The data before it was saved as '+BKDIR+'/'+r.safe+'.';}},50);}
      catch(e){pm('err','Restore failed: '+(e.message||e.name));}};
  }catch(e){}};showBk();
  $('sBk').onclick=async()=>{try{const n='ccs_desk_data_'+nowStamp().replace(' ','_').replace(/:/g,'').slice(0,15)+'.json';await writeBackup(n);audit('BACKUP',n);await save();pm('ok','Backup saved: '+BKDIR+'/'+n);showBk();}catch(e){pm('err','Backup failed: '+(e.message||e.name));}};
  $('sDl').onclick=()=>{const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ccs_desk_data_copy_'+today()+'.json';a.click();};
  $('sPw').onclick=()=>changePwScreen(false);$('sLock').onclick=()=>lockNow('');
  phSettings($('phBox'));
  if(adm){$('sDir').onclick=()=>{if(confirm('Switch to another data folder? You will be signed out. The current folder is not changed.')){ME=null;chooseFolder();}};
    $('sSave').onclick=()=>{const u=$('sUnit').value.trim(),m=Math.max(2,Math.min(240,+$('sIdle').value||60)),od=Math.max(1,Math.min(365,+$('sOff').value||30));if(!u){pm('err','Type the unit name.');return;}DB.unit=u;DB.settings.idleMin=m;DB.settings.offlineDays=od;DB.settings.selfJoin=$('sJoin').checked;audit('SETTINGS','unit '+u+', lock after '+m+' min, offline sign-in '+od+' days, first sign-in by themselves '+(DB.settings.selfJoin?'on':'off'));save();startApp();go('set');};
    $('sKey').onclick=()=>{if(confirm(DB.recovery?'Make a NEW recovery key?\n\nThe old key (on paper) stops working.':'Make the recovery key now?'))recoveryScreen(!DB.recovery);};}
  $('sAud').innerHTML='<tr><th>When</th><th>User</th><th>What</th><th>Details</th></tr>'+DB.audit.slice(-40).reverse().map(a=>'<tr><td>'+esc(disp(a.t))+'</td><td>'+esc(a.u)+'</td><td>'+esc(a.a)+'</td><td>'+esc(a.d)+'</td></tr>').join('');
};

// ---------------------------------------------------------------- installable app (on the website only)
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

if(window.__CCSD_TEST_DIR_PROMISE)window.__T={get DRAFT(){return DRAFT;},get DB(){return DB;},go:p=>go(p),save:()=>save(true)};
// ---------------------------------------------------------------- one window at a time
if(navigator.locks&&navigator.locks.request){
  navigator.locks.request('ccs-desk-window',{ifAvailable:true},lock=>{if(!lock){screen('<h1>CCS Desk is already open</h1><p class="sub">It is open in another tab or window of this browser. Use that one, or close it and reload this page.</p>');return;}boot();return new Promise(()=>{});});
}else boot();
})();
</script>
</body>
